trigger: none
pr: none

pool:
  vmImage: 'ubuntu-latest'

resources:
  containers:
    - container: securitytools
      image: namnamvt3/security-pipeline:latest

variables:
  - group: sap-btp-secrets
  - group: contrast-secrets
  - name: NODE_VERSION
    value: '22.x'
  - name: START_COMMAND
    value: 'npm run start'
  - name: APP_URL
    value: 'http://localhost:4004'
  - name: DAST_MINUTES
    value: '3'
  - name: SMOKE_PATHS
    value: '/,/health'
  - name: RUN_IAST
    value: 'false'

stages:
  # - stage: CodeTest
  #   displayName: 'Code quality and automated tests'
  #   jobs:
  #     - job: NpmTest
  #       displayName: 'Install dependencies and run npm test'
  #       steps:
  #         - checkout: self
  #           fetchDepth: 1

  #         - task: NodeTool@0
  #           displayName: 'Use Node.js $(NODE_VERSION)'
  #           inputs:
  #             versionSpec: '$(NODE_VERSION)'

  #         - bash: |
  #             set -euxo pipefail
  #             npm ci
  #           displayName: 'Install project dependencies'

  #         - bash: |
  #             set -euxo pipefail
  #             npm run test
  #           displayName: 'Run lint, unit tests, and integration tests'

  - stage: SecurityTest
    displayName: 'Security testing'
    # dependsOn: CodeTest
    # condition: succeeded()
    jobs:
      - job: SecuritySuite
        displayName: 'Secret scanning, SAST, SCA, DAST, and optional IAST'
        container: securitytools
        steps:
          - checkout: self
            fetchDepth: 0

          - bash: |
              set -euxo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              npm ci
            displayName: 'Install project dependencies once'

          - bash: |
              set -euxo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              gitleaks git . \
                --redact \
                --report-format sarif \
                --report-path "$(Build.ArtifactStagingDirectory)/gitleaks.sarif"
            displayName: 'Secret scanning with Gitleaks'

          - bash: |
              set -euxo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)"
              semgrep scan \
                --config p/javascript \
                --config p/nodejs \
                --config p/owasp-top-ten \
                --sarif \
                --output "$(Build.ArtifactStagingDirectory)/semgrep.sarif" \
                --error .
            displayName: 'SAST with Semgrep'

          - bash: |
              set -euxo pipefail
              npm audit --json > "$(Build.ArtifactStagingDirectory)/npm-audit.json" || true
              npm audit --audit-level=critical
            displayName: 'SCA with npm audit'

          - bash: |
              set -euxo pipefail
              nohup bash -c "$(START_COMMAND)" > "$(Build.ArtifactStagingDirectory)/app-security.log" 2>&1 &
              echo $! > "$(Build.ArtifactStagingDirectory)/app-security.pid"

              for i in $(seq 1 60); do
                if curl -fsS "$(APP_URL)" >/dev/null 2>&1; then
                  echo "Application is reachable at $(APP_URL)"
                  exit 0
                fi
                sleep 5
              done

              echo "Application did not become ready in time"
              tail -n 200 "$(Build.ArtifactStagingDirectory)/app-security.log" || true
              exit 1
            displayName: 'Start app locally once and wait until ready'

          - bash: |
              set -euxo pipefail
              mkdir -p "$(Build.ArtifactStagingDirectory)/zap"
              if [ -f .ci/zap-baseline.conf ]; then
                CONFIG_ARG="-c /zap/wrk/zap-baseline.conf"
                cp .ci/zap-baseline.conf "$(Build.ArtifactStagingDirectory)/zap/zap-baseline.conf"
              else
                CONFIG_ARG="-I"
              fi

              docker run --rm --network=host \
                -v "$(Build.ArtifactStagingDirectory)/zap:/zap/wrk" \
                ghcr.io/zaproxy/zaproxy:stable \
                zap-baseline.py \
                -t "$(APP_URL)" \
                -m "$(DAST_MINUTES)" \
                -J zap-report.json \
                -r zap-report.html \
                $CONFIG_ARG
            displayName: 'DAST with OWASP ZAP baseline'

          - bash: |
              set -euxo pipefail
              if [ "$(RUN_IAST)" != "true" ]; then
                echo "RUN_IAST is false. Skipping IAST."
                exit 0
              fi

              npm install --no-save @contrast/agent
              export NODE_OPTIONS="-r @contrast/agent"

              for path in $(echo "$(SMOKE_PATHS)" | tr ',' ' '); do
                echo "Hitting $(APP_URL)$path"
                curl -k -i -sS "$(APP_URL)$path" >/dev/null || true
              done

              sleep 20
            displayName: 'Optional IAST smoke traffic with Contrast'
            env:
              CONTRAST__API__TOKEN: $(CONTRAST__API__TOKEN)
              CONTRAST__APPLICATION__NAME: $(CONTRAST__APPLICATION__NAME)
              CONTRAST__SERVER__ENVIRONMENT: $(CONTRAST__SERVER__ENVIRONMENT)
              CONTRAST__SERVER__NAME: $(CONTRAST__SERVER__NAME)

          - bash: |
              set +e
              if [ -f "$(Build.ArtifactStagingDirectory)/app-security.pid" ]; then
                kill "$(cat "$(Build.ArtifactStagingDirectory)/app-security.pid")" || true
              fi
            displayName: 'Stop local app'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish secret scanning report'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/gitleaks.sarif'
              artifact: 'secret-scan-report'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SAST report'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/semgrep.sarif'
              artifact: 'sast-report'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish SCA report'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/npm-audit.json'
              artifact: 'sca-report'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish DAST report'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/zap'
              artifact: 'dast-report'
              publishLocation: 'pipeline'
            condition: always()

          - task: PublishPipelineArtifact@1
            displayName: 'Publish local app log'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/app-security.log'
              artifact: 'security-app-log'
              publishLocation: 'pipeline'
            condition: always()

